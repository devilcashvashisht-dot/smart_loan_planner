name: Build Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Mathematical Engine Tests
        run: flutter test

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-pub

      - name: Upload Production Release AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-loan-planner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
