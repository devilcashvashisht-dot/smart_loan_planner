name: Build Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Native Resources
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.smartloan --project-name smart_loan_planner
          # Remove auto-generated counter widget test from flutter create
          rm -f test/widget_test.dart
          
          # Add AdMob App ID to AndroidManifest.xml
          python3 -c "
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r') as f:
              content = f.read()
          admob_meta = '''
                  <meta-data
                      android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                      android:value=\"ca-app-pub-3940256099942544~3347511713\"/>
          '''
          content = content.replace('<application', '<application' + admob_meta, 1)
          with open(manifest, 'w') as f:
              f.write(content)
          print('AdMob metadata successfully injected')
          "
          # Ensure minSdk is at least 21 for google_mobile_ads
          python3 -c "
          gradle_file = 'android/app/build.gradle'
          with open(gradle_file, 'r') as f:
              c = f.read()
          c = c.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
          c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          with open(gradle_file, 'w') as f:
              f.write(c)
          print('minSdk updated to 21')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Mathematical Engine Tests
        run: flutter test test/calculator_service_test.dart

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload Production Release AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-loan-planner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
