name: Build Release Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Native Resources
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.smartloan --project-name smart_loan_planner
          rm -f test/widget_test.dart
          
          python3 -c "
          import os

          # 1. Update AndroidManifest.xml cleanly
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r') as f:
                  m = f.read()
              admob_meta = '''        <meta-data
                  android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                  android:value=\"ca-app-pub-3940256099942544~3347511713\"/>
          </application>'''
              m = m.replace('</application>', admob_meta)
              with open(manifest, 'w') as f:
                  f.write(m)
              print('AndroidManifest.xml patched successfully')

          # 2. Update build.gradle / build.gradle.kts
          for gf in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(gf):
                  with open(gf, 'r') as f:
                      c = f.read()
                  c = c.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
                  c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  c = c.replace('minSdk flutter.minSdkVersion', 'minSdk 21')
                  if 'multiDexEnabled' not in c:
                      if 'defaultConfig {' in c:
                          c = c.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true')
                  with open(gf, 'w') as f:
                      f.write(c)
                  print(f'{gf} patched successfully')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Mathematical Engine Tests
        run: flutter test test/calculator_service_test.dart

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release -v > build.log 2>&1 || (tail -n 120 build.log && exit 1)

      - name: Upload Production Release AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-loan-planner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
